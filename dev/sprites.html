<!doctype html>
<html lang="en">
  <!--
    Dev only (not in the production build): every archetype's walking sprite as
    the reveal card draws it (components/portrait.ts), at 4x, 3x and 2x, to check
    frames step cleanly on whole device pixels. Open /dev/sprites.html on the dev
    server; zoom the browser to try other device pixel ratios.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprite check</title>
    <style>
      html body {
        margin: 0;
        padding: 16px;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #1d2b3a;
        background: #f6e7c8;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      figure {
        margin: 0;
        padding: 8px;
        background: #fbf1dc;
        border-radius: 6px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: end;
        min-height: 100px;
      }
      figcaption {
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Sprite check</h1>
    <p id="status">Loading…</p>
    <div id="grid"></div>
    <script type="module" src="/src/dev/spriteGallery.ts"></script>
  </body>
</html>
