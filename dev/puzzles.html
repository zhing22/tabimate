<!doctype html>
<html lang="en">
  <!--
    Dev only (not in the production build): author a day's puzzle.
    Open /dev/puzzles.html on the dev server (npm run dev). Drafts autosave in this
    browser per date. "Save to project" writes public/data/puzzles/<date>.json through
    the dev server (scripts/vite/devPuzzleApi.ts), after the real validator passes.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle editor</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font:
          14px/1.45 system-ui,
          sans-serif;
        color: #1d2b3a;
        background: #f3efe6;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        margin-bottom: 8px;
      }
      #day {
        margin: 0 0 12px;
        color: #555;
      }
      .slot,
      aside section {
        margin-bottom: 12px;
        padding: 10px 12px;
        background: #fff;
        border-radius: 8px;
      }
      .slot header {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .slot__text {
        margin: 8px 0 4px;
        font-size: 15px;
      }
      .slot__meta {
        margin: 0 0 6px;
        color: #555;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 2px 6px;
        text-align: left;
        border-bottom: 1px solid #eee;
      }
      .aliases {
        color: #777;
        font-size: 12px;
      }
      .row--out {
        color: #999;
      }
      .counts td,
      .counts th {
        text-align: center;
      }
      aside {
        position: sticky;
        top: 16px;
      }
      aside h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .checks,
      #test-log {
        margin: 0;
        padding-left: 18px;
      }
      .error {
        color: #a32631;
      }
      .warn {
        color: #8a5a00;
      }
      .ok {
        color: #2c6e3f;
      }
      code {
        font-size: 12px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <h1>Puzzle editor</h1>
    <div class="controls">
      <label>Date <input type="date" id="date" /></label>
      <button type="button" id="import">Import this day's file</button>
      <button type="button" id="clear">Start over</button>
      <button type="button" id="download">Download JSON</button>
      <button type="button" id="save">Save to project</button>
      <span id="save-result"></span>
    </div>
    <p id="day"></p>
    <datalist id="animal-names"></datalist>
    <div class="layout">
      <main id="slots"></main>
      <aside>
        <section>
          <h2>Levels</h2>
          <div id="counts"></div>
        </section>
        <section>
          <h2>Test a guess (real matcher)</h2>
          <form id="test-form">
            <select id="test-slot"></select>
            <input id="test-guess" type="text" placeholder="Type a guess, press Enter" />
          </form>
          <ul id="test-log"></ul>
        </section>
        <section>
          <h2>Checks (real validator)</h2>
          <div id="checks"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/dev/puzzleEditor.ts"></script>
  </body>
</html>
