<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- resizes-content: on Android, the layout shrinks above the keyboard instead of hiding under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1d2b3a" />
    <title>Tabimate</title>
    <!-- Pixelify Sans, self-hosted (ui/styles/fonts.css): fetched at once, not when the CSS asks. -->
    <link
      rel="preload"
      href="/fonts/pixelify-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/pixelify-sans-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="scene" aria-hidden="true"></div>
    <!-- Decoration that stands in the scene (ui/layout/stage.ts): the loading path, "Ready?". -->
    <div id="stage-overlay" aria-hidden="true"></div>
    <main id="ui">
      <!-- Before any JS: the loading kit's walkers (inlined by scripts/vite/loadingKit.ts) and the line. -->
      <div class="loading-static">
        <div class="loading__hero" aria-hidden="true">
          <span class="loading__buddy"><span class="kit kit--animal"></span></span>
          <span class="loading__buddy"><span class="kit kit--traveller"></span></span>
        </div>
        <p class="loading">Packing your bag…</p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
